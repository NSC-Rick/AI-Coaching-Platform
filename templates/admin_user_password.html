{% extends "base.html" %}

{% block title %}Reset Password - Admin{% endblock %}

{% block content %}
<div class="admin-portal">
    <div class="welcome-section">
        <h2>Reset Password</h2>
        <p class="subtitle">{{ user.email }}</p>
    </div>

    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">&larr; Users</a>
        <a href="{{ url_for('admin_user_detail', user_id=user.id) }}" class="btn btn-secondary">View User</a>
    </div>

    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label for="password">New Temporary Password</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
