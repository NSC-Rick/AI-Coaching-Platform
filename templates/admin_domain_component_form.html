{% extends "base.html" %}

{% block title %}{% if component %}Edit{% else %}Add{% endif %} Component - {{ domain.name }}{% endblock %}

{% block content %}
<div class="admin-portal">
    <div class="welcome-section">
        <h2>{% if component %}Edit{% else %}Add{% endif %} Component</h2>
        <p class="subtitle">{{ domain.name }}</p>
    </div>

    <div style="margin-bottom: 1rem;">
        <a href="{{ url_for('admin_domain_detail', domain_id=domain.id) }}" class="btn btn-secondary">&larr; Domain</a>
    </div>

    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label for="component_type">Component Type</label>
                <select id="component_type" name="component_type" required>
                    {% for type, label in component_labels.items() %}
                    <option value="{{ type }}" {% if component and component.component_type == type %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="{{ component.name if component else '' }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4">{{ component.description if component else '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="draft" {% if component and component.status == 'draft' %}selected{% endif %}>Draft</option>
                    <option value="active" {% if component and component.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if component and component.status == 'inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">{% if component %}Update{% else %}Create{% endif %} Component</button>
        </form>
    </div>
</div>
{% endblock %}
